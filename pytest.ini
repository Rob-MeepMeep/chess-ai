[pytest]
# Without this, a bare `pytest` invocation only puts tests/ itself on
# sys.path (no __init__.py in tests/, so pytest's rootpath stops there),
# not the repo root where chessai/, train_chess.py, main.py etc. actually
# live -- every test module importing them fails with ModuleNotFoundError.
# `python3 -m pytest` masked this on the machine this suite was written
# on, since -m itself adds the current directory to sys.path regardless
# of pytest's own behaviour; a bare `pytest` on a different machine (and
# a different pytest major version) surfaced it immediately. pythonpath
# is the explicit, version-independent fix (pytest >=7.0) rather than
# relying on rootdir-detection internals that already differed between
# pytest 8.4.2 and 9.1.1 in this exact case.
pythonpath = .
